{% extends "base.html" %}
{% block title %}Login — PrintFlow{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>Welcome Back 👋</h1>
        <p class="auth-subtitle">Sign in to manage your print orders</p>

        <form method="post" action="{% url 'accounts:login' %}">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" name="username" id="username" class="form-input" placeholder="Your username" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" name="password" id="password" class="form-input" placeholder="Your password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Sign In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{% url 'accounts:signup' %}">Create one</a>
        </div>
    </div>
</div>
{% endblock %}
